    <path d="M110 92 a26 26 0 0 1 26 -26 h928 a26 26 0 0 1 26 26 v40 H110 Z" fill="#F3F5FB"/>
    <circle cx="152" cy="96" r="8.5" fill="#FF5F57"/>
