      <rect x="470" y="630" width="76" height="24" rx="8" fill="#1B4B8F"/>
      <rect x="558" y="634" width="140" height="12" rx="6" fill="#C6CCDC"/>
      <rect x="558" y="652" width="96" height="10" rx="5" fill="#DDE1ED"/>
