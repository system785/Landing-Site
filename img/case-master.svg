    <g>
      <rect x="750" y="614" width="280" height="60" rx="16" fill="#F6F7FC"/>
      <rect x="770" y="630" width="76" height="24" rx="8" fill="#1B4B8F"/>
      <rect x="858" y="634" width="140" height="12" rx="6" fill="#C6CCDC"/>
