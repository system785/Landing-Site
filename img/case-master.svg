      <stop offset="1" stop-color="#0B2447"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#04101F" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="120" cy="80" r="200" fill="#FFFFFF" opacity=".07"/>
  <circle cx="1110" cy="700" r="230" fill="#FFC53D" opacity=".12"/>
  <g fill="#FFFFFF" opacity=".14">
