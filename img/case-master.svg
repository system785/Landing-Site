<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Кейс: сайт мастера по ремонту квартир">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2447"/>
      <stop offset=".55" stop-color="#1B4B8F"/>
      <stop offset="1" stop-color="#2E9BE0"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A1F"/>
      <stop offset="1" stop-color="#FFC53D"/>
