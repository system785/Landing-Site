<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Обложка статьи: как выбрать исполнителя на создание сайта">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1F"/>
      <stop offset=".6" stop-color="#121A36"/>
      <stop offset="1" stop-color="#1D2A52"/>
    </linearGradient>
    <linearGradient id="a1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B5BFF"/>
      <stop offset="1" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="a2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="520" r="190" fill="#22C55E" opacity=".3" filter="url(#soft)"/>
  <circle cx="120" cy="90" r="160" fill="#3B5BFF" opacity=".45" filter="url(#soft)"/>
  <g fill="#FFFFFF" opacity=".10">
    <circle cx="1120" cy="90" r="5"/><circle cx="90" cy="540" r="4"/><circle cx="540" cy="60" r="3"/>
  </g>

  <rect x="80" y="86" width="280" height="46" rx="23" fill="url(#a2)"/>
  <text x="220" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#04210F" text-anchor="middle" letter-spacing="1.5">ПРАКТИКА</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="60" font-weight="800" fill="#FFFFFF">
    <text x="80" y="246">9 вопросов</text>
    <text x="80" y="326">перед выбором</text>
    <text x="80" y="406" fill="url(#a1)">исполнителя</text>
  </g>
  <rect x="80" y="446" width="430" height="16" rx="8" fill="#FFFFFF" opacity=".3"/>
  <rect x="80" y="478" width="350" height="16" rx="8" fill="#FFFFFF" opacity=".18"/>

  <!-- Чек-лист -->
  <g>
    <rect x="740" y="120" width="380" height="390" rx="26" fill="#FFFFFF" opacity=".07" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="2"/>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#E7ECFA">
      <g transform="translate(776,168)">
        <rect width="46" height="46" rx="14" fill="url(#a2)"/>
        <path d="M14 24 l8 9 11 -16" stroke="#04210F" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="64" y="31">Портфолио и кейсы</text>
      </g>
      <g transform="translate(776,242)">
        <rect width="46" height="46" rx="14" fill="url(#a2)"/>
        <path d="M14 24 l8 9 11 -16" stroke="#04210F" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="64" y="31">Понятная цена</text>
      </g>
      <g transform="translate(776,316)">
        <rect width="46" height="46" rx="14" fill="url(#a2)"/>
        <path d="M14 24 l8 9 11 -16" stroke="#04210F" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="64" y="31">Сроки в договоре</text>
      </g>
      <g transform="translate(776,390)">
        <rect width="46" height="46" rx="14" fill="#1B2748" stroke="#FFC53D" stroke-width="3"/>
        <path d="M14 24 l8 9 11 -16" stroke="#FFC53D" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="64" y="31">Без предоплаты</text>
      </g>
    </g>
  </g>
</svg>
