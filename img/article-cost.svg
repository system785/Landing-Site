<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Обложка статьи: сколько стоит сайт для Яндекс.Директ">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1F"/>
      <stop offset=".55" stop-color="#141E3C"/>
      <stop offset="1" stop-color="#2A1E5C"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A18"/>
      <stop offset="1" stop-color="#FFC53D"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3B5BFF"/>
      <stop offset="1" stop-color="#7C4DFF"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="170" fill="#7C4DFF" opacity=".5" filter="url(#soft)"/>
  <circle cx="1060" cy="520" r="150" fill="#FF7A18" opacity=".35" filter="url(#soft)"/>
  <g fill="#FFFFFF" opacity=".10">
    <circle cx="90" cy="90" r="5"/><circle cx="180" cy="150" r="3"/><circle cx="1120" cy="300" r="4"/>
    <circle cx="70" cy="420" r="4"/><circle cx="560" cy="70" r="3"/>
  </g>

  <!-- Плашка -->
  <rect x="80" y="88" width="230" height="46" rx="23" fill="url(#acc)"/>
  <text x="195" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#241000" text-anchor="middle" letter-spacing="1.5">СТАТЬЯ</text>

  <!-- Заголовок -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF">
    <text x="80" y="248">Сколько стоит</text>
    <text x="80" y="330">сайт для</text>
    <text x="80" y="412" fill="url(#acc)">Яндекс.Директ</text>
  </g>
  <rect x="80" y="450" width="470" height="16" rx="8" fill="#FFFFFF" opacity=".35"/>
  <rect x="80" y="482" width="390" height="16" rx="8" fill="#FFFFFF" opacity=".22"/>

  <!-- Диаграмма цен -->
  <g>
    <rect x="760" y="330" width="70" height="180" rx="16" fill="url(#bar)" opacity=".85"/>
    <rect x="850" y="250" width="70" height="260" rx="16" fill="url(#bar)" opacity=".95"/>
    <rect x="940" y="170" width="70" height="340" rx="16" fill="url(#acc)"/>
    <rect x="1030" y="110" width="70" height="400" rx="16" fill="url(#acc)"/>
    <text x="975" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800" fill="#FFC53D" text-anchor="middle">₽</text>
    <rect x="740" y="536" width="380" height="14" rx="7" fill="#FFFFFF" opacity=".25"/>
  </g>
</svg>
