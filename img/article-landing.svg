<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Обложка статьи: лендинг или сайт-визитка">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1F"/>
      <stop offset=".6" stop-color="#101B3A"/>
      <stop offset="1" stop-color="#123059"/>
    </linearGradient>
    <linearGradient id="a1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B5BFF"/>
      <stop offset="1" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="a2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A18"/>
      <stop offset="1" stop-color="#FFC53D"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="100" r="180" fill="#3B5BFF" opacity=".45" filter="url(#soft)"/>
  <circle cx="140" cy="560" r="170" fill="#7C4DFF" opacity=".4" filter="url(#soft)"/>
  <g fill="#FFFFFF" opacity=".10">
    <circle cx="80" cy="80" r="5"/><circle cx="1140" cy="520" r="5"/><circle cx="620" cy="60" r="3"/>
  </g>

  <rect x="80" y="86" width="230" height="46" rx="23" fill="url(#a2)"/>
  <text x="195" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#241000" text-anchor="middle" letter-spacing="1.5">СРАВНЕНИЕ</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="60" font-weight="800" fill="#FFFFFF">
    <text x="80" y="246">Лендинг или</text>
    <text x="80" y="326" fill="url(#a1)">сайт-визитка:</text>
    <text x="80" y="406">что выбрать</text>
    <text x="80" y="474">для рекламы</text>
  </g>
  <rect x="80" y="512" width="380" height="14" rx="7" fill="#FFFFFF" opacity=".3"/>

  <!-- Два экрана -->
  <g>
    <rect x="740" y="150" width="180" height="330" rx="20" fill="url(#a1)" opacity=".92"/>
    <rect x="764" y="182" width="132" height="14" rx="7" fill="#FFFFFF" opacity=".9"/>
    <rect x="764" y="208" width="96" height="14" rx="7" fill="#FFFFFF" opacity=".6"/>
    <rect x="764" y="244" width="132" height="70" rx="12" fill="#FFFFFF" opacity=".3"/>
    <rect x="764" y="334" width="132" height="18" rx="9" fill="#FFFFFF" opacity=".85"/>
    <rect x="764" y="366" width="132" height="18" rx="9" fill="#FFFFFF" opacity=".55"/>
    <rect x="764" y="418" width="100" height="34" rx="17" fill="#FFC53D"/>

    <rect x="950" y="190" width="180" height="290" rx="20" fill="#1B2748" stroke="#3B5BFF" stroke-width="3"/>
    <rect x="974" y="220" width="132" height="14" rx="7" fill="#FFFFFF" opacity=".9"/>
    <rect x="974" y="246" width="86" height="14" rx="7" fill="#FFFFFF" opacity=".55"/>
    <rect x="974" y="282" width="132" height="60" rx="12" fill="#3B5BFF" opacity=".5"/>
    <rect x="974" y="362" width="132" height="16" rx="8" fill="#FFFFFF" opacity=".5"/>
    <rect x="974" y="390" width="110" height="16" rx="8" fill="#FFFFFF" opacity=".35"/>
    <rect x="974" y="424" width="100" height="34" rx="17" fill="#7C4DFF"/>
  </g>

  <!-- Знак versus -->
  <circle cx="948" cy="160" r="42" fill="#0A0F1F" stroke="#FFC53D" stroke-width="3"/>
  <text x="948" y="174" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#FFC53D" text-anchor="middle">VS</text>
</svg>
