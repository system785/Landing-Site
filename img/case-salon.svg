    <circle cx="800" cy="378" r="62" fill="#FFFFFF" opacity=".92"/>
    <path d="M706 548 C714 468 756 434 800 434 C844 434 886 468 894 548 Z" fill="#FFFFFF" opacity=".92"/>
    <rect x="636" y="520" width="150" height="34" rx="17" fill="#FFFFFF" opacity=".95"/>
    <text x="711" y="543" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#5A2E7A" text-anchor="middle">12 лет опыта</text>
  </g>

