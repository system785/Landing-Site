<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Кейс: редизайн сайта салона красоты">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B1E5E"/>
      <stop offset=".55" stop-color="#7A2E63"/>
      <stop offset="1" stop-color="#E8608C"/>
    </linearGradient>
    <linearGradient id="ph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8FB1"/>
      <stop offset="1" stop-color="#8E4BFF"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8608C"/>
      <stop offset="1" stop-color="#8E4BFF"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#1A0B25" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="190" fill="#FFFFFF" opacity=".08"/>
  <circle cx="90" cy="690" r="220" fill="#FFD3E0" opacity=".12"/>
  <g fill="#FFFFFF" opacity=".12">
