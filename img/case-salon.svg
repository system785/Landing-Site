      <rect x="468" y="632" width="24" height="24" rx="8" fill="url(#acc)"/>
      <rect x="504" y="634" width="150" height="12" rx="6" fill="#C6CCDC"/>
      <rect x="504" y="652" width="104" height="10" rx="5" fill="#DDE1ED"/>
