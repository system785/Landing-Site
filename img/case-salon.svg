    <g>
      <rect x="750" y="614" width="280" height="60" rx="16" fill="#F6F7FC"/>
      <rect x="768" y="632" width="24" height="24" rx="8" fill="url(#acc)"/>
      <rect x="804" y="634" width="150" height="12" rx="6" fill="#C6CCDC"/>
