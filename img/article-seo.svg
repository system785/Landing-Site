<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Обложка статьи: SEO-продвижение и статьи на сайте">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1F"/>
      <stop offset=".6" stop-color="#121A36"/>
      <stop offset="1" stop-color="#1D2A52"/>
    </linearGradient>
    <linearGradient id="a1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B5BFF"/>
      <stop offset="1" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="a2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B5BFF"/>
      <stop offset="1" stop-color="#7C4DFF"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1060" cy="110" r="180" fill="#3B5BFF" opacity=".38" filter="url(#soft)"/>
  <circle cx="140" cy="540" r="150" fill="#7C4DFF" opacity=".32" filter="url(#soft)"/>
  <g fill="#FFFFFF" opacity=".10">
    <circle cx="1120" cy="520" r="5"/><circle cx="90" cy="90" r="4"/><circle cx="600" cy="580" r="3"/>
  </g>

  <rect x="80" y="86" width="230" height="46" rx="23" fill="url(#a2)"/>
  <text x="195" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">SEO И СТАТЬИ</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="60" font-weight="800" fill="#FFFFFF">
    <text x="80" y="246">Как сайт находят</text>
    <text x="80" y="326">в поиске — и зачем</text>
    <text x="80" y="406" fill="url(#a1)">на нём статьи</text>
  </g>
  <rect x="80" y="446" width="430" height="16" rx="8" fill="#FFFFFF" opacity=".3"/>
  <rect x="80" y="478" width="350" height="16" rx="8" fill="#FFFFFF" opacity=".18"/>

  <!-- Поиск и рост позиций -->
  <g>
    <rect x="740" y="120" width="380" height="390" rx="26" fill="#FFFFFF" opacity=".07" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="2"/>
    <g transform="translate(790,164)">
      <circle cx="46" cy="42" r="32" fill="none" stroke="url(#a1)" stroke-width="10"/>
      <path d="M70 66 L100 96" stroke="url(#a1)" stroke-width="12" stroke-linecap="round"/>
      <text x="126" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#E7ECFA">Запрос</text>
    </g>
    <g transform="translate(790,300)">
      <rect x="0" y="90" width="46" height="60" rx="8" fill="#FFFFFF" opacity=".22"/>
      <rect x="66" y="60" width="46" height="90" rx="8" fill="#FFFFFF" opacity=".35"/>
      <rect x="132" y="30" width="46" height="120" rx="8" fill="url(#a2)"/>
      <rect x="198" y="0" width="46" height="150" rx="8" fill="url(#a2)"/>
      <path d="M10 116 L90 84 L156 54 L232 20" stroke="#FFC53D" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="232" cy="20" r="9" fill="#FFC53D"/>
      <text x="0" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#A9B3CC">Рост переходов из поиска</text>
    </g>
  </g>
</svg>
